<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ad6bf"/>
      <stop offset="100%" stop-color="#1a9fc6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#ffffff"/>
  <!-- head -->
  <circle cx="50" cy="24" r="7.5" fill="#283750"/>
  <!-- shoulders / arms -->
  <path d="M33 38 Q50 30 67 38" stroke="#283750" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- body silhouette left -->
  <path d="M40 38 Q35 52 41 78" stroke="#283750" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- body silhouette right -->
  <path d="M60 38 Q65 52 59 78" stroke="#283750" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- measuring tape ellipse around waist -->
  <ellipse cx="50" cy="56" rx="22" ry="8.5" fill="none" stroke="url(#tape)" stroke-width="7"/>
  <!-- tape ticks -->
  <g stroke="#ffffff" stroke-width="1.4" opacity="0.85">
    <line x1="42" y1="62" x2="42" y2="65"/>
    <line x1="47" y1="63" x2="47" y2="66"/>
    <line x1="52" y1="63" x2="52" y2="66"/>
    <line x1="57" y1="62" x2="57" y2="65"/>
  </g>
</svg>
